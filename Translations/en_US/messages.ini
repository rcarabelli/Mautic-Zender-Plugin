; Settings information architecture and guidance
mautic.zender.settings.page.title="Channel settings"
mautic.zender.settings.page.subtitle="Configure artificial intelligence, sending behavior, phone capacity and the internal organization of your Zender accounts."
mautic.zender.settings.section.ai.kicker="Message intelligence"
mautic.zender.settings.section.ai.title="AI provider and model"
mautic.zender.settings.section.ai.subtitle="Choose the provider, credentials and model that will later support controlled WhatsApp message editing."
mautic.zender.settings.section.ai.guide_title="How to configure AI"
mautic.zender.settings.section.ai.guide_body="Complete this block before connecting artificial intelligence to message workflows."
mautic.zender.settings.section.ai.guide_1="Select one active provider and enter only the API key that you want to add or replace."
mautic.zender.settings.section.ai.guide_2="Use Load models after choosing the provider. A stored key can be reused without displaying it."
mautic.zender.settings.section.ai.guide_3="Saving selects the provider and model; it does not yet rewrite or send WhatsApp messages."
mautic.zender.settings.section.dispatch.kicker="Global sending behavior"
mautic.zender.settings.section.dispatch.title="Sending schedule and dispatcher"
mautic.zender.settings.section.dispatch.subtitle="Control how frequently queued messages are processed, during which hours and whether sending is active."
mautic.zender.settings.section.dispatch.guide_title="How dispatch works"
mautic.zender.settings.section.dispatch.guide_body="These controls affect the global sending process without deleting pending work."
mautic.zender.settings.section.dispatch.guide_1="The interval defines the minimum time between dispatcher cycles and changes the estimated daily capacity."
mautic.zender.settings.section.dispatch.guide_2="The operating window limits sending to the selected hours."
mautic.zender.settings.section.dispatch.guide_3="Pausing the dispatcher stops outgoing processing while messages may continue entering the queue."
mautic.zender.settings.section.phones.kicker="Sending resources"
mautic.zender.settings.section.phones.title="Phone availability and capacity"
mautic.zender.settings.section.phones.subtitle="Choose which phones may send, adjust individual daily limits and apply temporary pauses."
mautic.zender.settings.section.phones.guide_title="How phone controls interact"
mautic.zender.settings.section.phones.guide_body="Use these controls to manage real sending capacity without changing the contact-to-Zender account association."
mautic.zender.settings.section.phones.guide_1="Only enabled phones participate in dispatch."
mautic.zender.settings.section.phones.guide_2="An individual quota overrides the calculated daily quota only for that phone."
mautic.zender.settings.section.phones.guide_3="A temporary pause keeps the phone configured but makes it unavailable until the selected time."
mautic.zender.settings.section.admin.kicker="Internal organization"
mautic.zender.settings.section.admin.title="Account names and operating order"
mautic.zender.settings.section.admin.subtitle="Give each managed phone a clear internal label and define the order used by the administration interface."
mautic.zender.settings.section.admin.guide_title="What this changes"
mautic.zender.settings.section.admin.guide_body="This block is administrative. It helps operators recognize accounts and understand their order."
mautic.zender.settings.section.admin.guide_1="Aliases change only the name displayed inside Mautic."
mautic.zender.settings.section.admin.guide_2="The position determines the internal administrative order."
mautic.zender.settings.section.admin.guide_3="Neither setting changes the real phone number, Zender identifier, quota or pending work."
